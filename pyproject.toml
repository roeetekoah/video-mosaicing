[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-mosaicing"
version = "0.2.0"
description = "Direct Lucas-Kanade video panoramas with local depth-aware multi-frame alignment"
requires-python = ">=3.10"
dependencies = ["numpy>=2,<3", "opencv-python-headless>=4.12,<4.13", "Pillow>=11,<12"]

[project.optional-dependencies]
test = ["pytest>=8.4,<9"]

[project.scripts]
video-mosaic = "video_mosaicing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
